name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend build (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build all available projects
        shell: bash
        run: |
          mapfile -t projects < <(find backend -name '*.csproj' -type f | sort)

          if [ ${#projects[@]} -eq 0 ]; then
            echo "Không tìm thấy project .NET trong backend."
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "===== Restore: $project ====="
            dotnet restore "$project"

            echo "===== Build: $project ====="
            dotnet build "$project" --configuration Release --no-restore
          done

  compose-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create temporary environment
        working-directory: backend
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=appuser
          POSTGRES_PASSWORD=CI_TEST_PASSWORD
          POSTGRES_DB=ai_db
          AUTH_DB=auth_db
          POI_DB=poi_db
          AI_DB=ai_db
          RABBITMQ_DEFAULT_USER=appuser
          RABBITMQ_DEFAULT_PASS=CI_TEST_PASSWORD
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=CI_TEST_PASSWORD
          MINIO_BUCKET_NAME=narration-audio
          JWT_KEY=CI_TEST_RANDOM_SECRET_AT_LEAST_32_BYTES
          EOF

      - name: Validate Compose syntax
        working-directory: backend
        run: docker compose config --quiet
