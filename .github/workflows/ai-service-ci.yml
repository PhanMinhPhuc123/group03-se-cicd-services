
name: AiService CI

on:
  push:
    branches:
      - feature/ai-service
    paths:
      - 'backend/AiService/**'
      - '.github/workflows/ai-service-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/AiService/**'
      - '.github/workflows/ai-service-ci.yml'

jobs:
  build:
    name: Build AiService
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/AiService/AiService.csproj

      - name: Build AiService
        run: dotnet build backend/AiService/AiService.csproj --configuration Release --no-restore

      - name: Build Docker image
        run: docker build -f backend/AiService/Dockerfile -t aiservice-ci backend/AiService
