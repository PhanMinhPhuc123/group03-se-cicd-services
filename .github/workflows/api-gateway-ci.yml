
name: API Gateway CI

on:
  push:
    branches:
      - fix/api-gateway-workflow
    paths:
      - 'backend/ApiGateway/**'
      - '.github/workflows/api-gateway-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'backend/ApiGateway/**'
      - '.github/workflows/api-gateway-ci.yml'

jobs:
  build:
    name: Build API Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/ApiGateway/ApiGateway.csproj

      - name: Build API Gateway
        run: dotnet build backend/ApiGateway/ApiGateway.csproj --configuration Release --no-restore
