name: PoiService CI

on:
  push:
    branches:
      - feature/poi-service-refactor
    paths:
      - 'backend/PoiService/**'
      - '.github/workflows/poi-service-ci.yml'

  pull_request:
    branches:
      - develop
    paths:
      - 'backend/PoiService/**'
      - '.github/workflows/poi-service-ci.yml'

jobs:
  build:
    name: Build PoiService
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/PoiService/PoiService.csproj

      - name: Build PoiService
        run: dotnet build backend/PoiService/PoiService.csproj --configuration Release --no-restore
