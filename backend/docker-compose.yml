

services:
  # 1. Ứng dụng AiService
  aiservice:
    build:
      context: ./AiService
      dockerfile: Dockerfile
    container_name: app_aiservice
    ports:
      - "18080:8080"
    env_file:
      - .env
    environment:
      # Ghi đè cấu hình appsettings.json bằng các biến môi trường
      # Dùng tên service (postgres, rabbitmq, minio) làm Hostname
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  # 2. Database PostgreSQL (dùng pgvector như bạn chọn)
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Message Broker RabbitMQ
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ai-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4. Storage MinIO
  minio:
    image: soldevelo/minio:2026.7
    container_name: ai-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/bitnami/minio/data
    command: server /bitnami/minio/data --console-address ":9001"

volumes:
  postgres_data:
  minio_data: