services:
  # 1. Ung dung AiService
  aiservice:
    build:
      context: ./AiService
      dockerfile: Dockerfile
    container_name: app_aiservice
    ports:
      - "18080:8080"
    env_file:
      - .env
    environment:
      # Ket noi PostgreSQL
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

      # Ket noi RabbitMQ
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}

      # Ket noi MinIO
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - Minio__BucketName=${MINIO_AUDIO_BUCKET:-narration-audio}

      # Cau hinh OpenAI
      - OpenAI__ApiKey=${OPENAI_API_KEY:-}
      - OpenAI__BaseUrl=${OPENAI_BASE_URL:-https://api.openai.com/v1/}
      - OpenAI__TextModel=${OPENAI_TEXT_MODEL:-gpt-4o-mini}
      - OpenAI__TtsModel=${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      - OpenAI__TtsVoice=${OPENAI_TTS_VOICE:-alloy}
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  # 2. Database PostgreSQL su dung pgvector
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 3. Message Broker RabbitMQ
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ai-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4. Storage MinIO
  minio:
    image: soldevelo/minio:2026.7
    container_name: ai-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/bitnami/minio/data
    command: server /bitnami/minio/data --console-address ":9001"

volumes:
  postgres_data:
  minio_data: